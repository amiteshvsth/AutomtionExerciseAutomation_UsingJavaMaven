stages:
  - docker-build
  - build
  - test
  - publish

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  DOCKER_TLS_CERTDIR: ""

cache:
  paths:
    - .m2/repository

# ========================
# 0️⃣ BUILD CUSTOM DOCKER IMAGE (ONE TIME / WHEN NEEDED)
# ========================
docker-build:
  stage: docker-build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    changes:
      - Dockerfile

# ========================
# 1️⃣ BUILD JOB
# ========================
build:
  stage: build
  image: $CI_REGISTRY_IMAGE:latest
  script:
    - java -version
    - mvn -version
    - mvn -B clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week

# ========================
# 2️⃣ TEST JOB (Matrix Browsers)
# ========================
test:
  stage: test
  image: $CI_REGISTRY_IMAGE:latest

  parallel:
    matrix:
      - BROWSER: "chrome-headless"
      - BROWSER: "firefox-headless"

  script:
    - mvn -B test -Dbrowser=$BROWSER -DthreadCount=4 -Dorg.slf4j.simpleLogger.defaultLogLevel=warn || true

  artifacts:
    when: always
    paths:
      - target/surefire-reports/
      - ExtentReport/
    reports:
      junit: target/surefire-reports/TEST-*.xml
    expire_in: 1 week

# ========================
# 3️⃣ PUBLISH JOB
# ========================
publish:
  stage: publish
  image: $CI_REGISTRY_IMAGE:latest
  needs: ["build"]
  script:
    - mkdir staging
    - cp target/*.jar staging || true
  artifacts:
    paths:
      - staging/
    expire_in: 1 week