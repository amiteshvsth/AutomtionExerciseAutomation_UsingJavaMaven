stages:
  - docker-build
  - build
  - test
  - publish
  - report

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  DOCKER_TLS_CERTDIR: ""

cache:
  key: maven-cache
  paths:
    - .m2/repository

# ========================
# 0️⃣ BUILD CUSTOM DOCKER IMAGE (ONLY WHEN DOCKERFILE CHANGES)
# ========================
docker-build:
  stage: docker-build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --pull -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    changes:
      - Dockerfile

# ========================
# 1️⃣ BUILD JOB
# ========================
build:
  stage: build
  image: $CI_REGISTRY_IMAGE:latest

  script:
    - java -version
    - mvn -version

    # Pre-download dependencies (faster builds)
    - mvn -B dependency:go-offline

    # Parallel Maven build
    - mvn -B -T 1C clean package -DskipTests

  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week

# ========================
# 2️⃣ TEST JOB (PARALLEL BROWSER MATRIX)
# ========================
test:
  stage: test
  image: $CI_REGISTRY_IMAGE:latest
  timeout: 30m

  parallel:
    matrix:
      - BROWSER: "chrome-headless"
      - BROWSER: "firefox-headless"

  script:
    - echo "Running tests on $BROWSER"
    - mvn -B test -Dbrowser=$BROWSER -DthreadCount=4 -Dsurefire.rerunFailingTestsCount=2 -Dorg.slf4j.simpleLogger.defaultLogLevel=warn || true

  artifacts:
    when: always
    paths:
      - target/surefire-reports/
      - ExtentReport/
    reports:
      junit: target/surefire-reports/TEST-*.xml
    expire_in: 1 week

# ========================
# 3️⃣ PUBLISH BUILD ARTIFACT
# ========================
publish:
  stage: publish
  image: $CI_REGISTRY_IMAGE:latest
  needs: ["build"]

  script:
    - mkdir -p staging
    - cp target/*.jar staging || true

  artifacts:
    paths:
      - staging/
    expire_in: 1 week

# ========================
# 4️⃣ PUBLISH EXTENT REPORT AS WEB PAGE
# ========================
pages:
  stage: report
  when: always
  image: alpine:latest
  needs: ["test"]

  script:
    - mkdir public
    - cp -r ExtentReport/* public/ || true

  artifacts:
    paths:
      - public