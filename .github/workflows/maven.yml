name: Java Maven CI (Build | Test | Report | Publish)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 🔥 Required to fix "Resource not accessible by integration"
permissions:
  contents: read
  checks: write

jobs:

  # ========================
  # 1️⃣ BUILD JOB
  # ========================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java & Maven
        run: |
          java -version
          mvn -version

      - name: Build Project (Skip Tests)
        run: mvn -B clean package -DskipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: target/*.jar


  # ========================
  # 2️⃣ TEST JOB
  # ========================
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run TestNG Tests
        run: mvn -B test -q \
          -Dbrowser=chrome-headless \
          -Dorg.slf4j.simpleLogger.defaultLogLevel=warn

      - name: Publish Test Results (JUnit Format)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: TestNG Results
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  # ========================
  # 4️⃣ PUBLISH JOB
  # ========================
  publish:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: staging

      - name: Upload Final Package
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging