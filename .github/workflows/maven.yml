name: Java Maven Build & Publish Artifact

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Run Tests with TestNG
        run: mvn -B clean test -q -Dorg.slf4j.simpleLogger.defaultLogLevel=warn -Dbrowser=chrome-headless

  publish-job:
    runs-on: ubuntu-latest
    needs: build_test
    if: always()

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Verify
        run: mvn --batch-mode --update-snapshots verify -DskipTests

      - name: Copy Artifacts
        run: mkdir -p staging && cp target/*.jar staging || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging