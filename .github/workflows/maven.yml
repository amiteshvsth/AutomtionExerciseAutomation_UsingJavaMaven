name: Java Maven CI (Build | Test | Publish)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write

jobs:

  # ========================
  # 1️⃣ BUILD JOB
  # ========================
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: java -version && mvn -version

      - run: mvn -B clean package -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: target/*.jar


  # ========================
  # 2️⃣ TEST JOB
  # ========================
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: mvn -B test -q -Dbrowser=chrome-headless -Dorg.slf4j.simpleLogger.defaultLogLevel=warn

      - name: Publish Test Results (JUnit Format)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: TestNG Results
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/


  # ========================
  # 3️⃣ PUBLISH JOB
  # ========================
  publish:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: staging

      - uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging