name: Java Maven CI (Build | Test | Publish)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write

jobs:

  # ========================
  # 1️⃣ BUILD JOB
  # ========================
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java & Maven
        run: java -version && mvn -version

      # Prefetch dependencies
      - name: Download Maven Dependencies
        run: mvn -B dependency:go-offline

      # Parallel Maven build
      - name: Build Project
        run: mvn -B -T 1C clean package -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: target/*.jar


  # ========================
  # 2️⃣ TEST JOB
  # ========================
  test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome-headless, firefox-headless ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run TestNG Tests (${{ matrix.browser }})
        run: |
          echo "Running tests on ${{ matrix.browser }}"
          mvn -B test -Dbrowser=${{ matrix.browser }} -DthreadCount=4 -Dsurefire.rerunFailingTestsCount=2 -Dorg.slf4j.simpleLogger.defaultLogLevel=warn

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: TestNG Results (${{ matrix.browser }})
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.browser }}
          path: target/surefire-reports/

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ matrix.browser }}
          path: ExtentReport/
          if-no-files-found: ignore

  # ========================
  # 3️⃣ PUBLISH JOB
  # ========================
  publish:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: staging

      - uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging

  # ========================
  # 4️⃣ PUSH CODE TO GITLAB
  # ========================
  sync-gitlab:
    runs-on: ubuntu-latest
    needs: [ build ]
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/amiteshvsth-group/AutomtionExerciseAutomation_UsingJavaMaven.git
          git push gitlab main --force

  # ========================
  # 5️⃣ PUBLISH EXTENT REPORT TO GITHUB PAGES
  # ========================
  publish-report:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Chrome Report
        uses: actions/download-artifact@v4
        with:
          name: extent-report-chrome-headless
          path: site/chrome

      - name: Download Firefox Report
        uses: actions/download-artifact@v4
        with:
          name: extent-report-firefox-headless
          path: site/firefox

      - name: Create Report Landing Page
        run: |
          mkdir -p site
          cat <<EOF > site/index.html
          <html>
          <head>
          <title>Automation Test Reports</title>
          <style>
          body { font-family: Arial; text-align:center; margin-top:80px; }
          a { display:block; margin:20px; font-size:20px; }
          </style>
          </head>
          <body>
          <h1>Automation Test Reports</h1>
          <a href="./chrome/index.html">Chrome Test Report</a>
          <a href="./firefox/index.html">Firefox Test Report</a>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4