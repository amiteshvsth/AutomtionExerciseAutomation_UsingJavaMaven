name: Java Maven CI (Build | Test | Publish)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write

jobs:

  # ========================
  # 1️⃣ BUILD JOB
  # ========================
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: java -version && mvn -version

      - run: mvn -B clean package -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: target/*.jar


  # ========================
  # 2️⃣ TEST JOB
  # ========================
  test:
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome-headless, firefox-headless ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run TestNG Tests (${{ matrix.browser }})
        run: mvn -B test -q -Dbrowser=${{ matrix.browser }} -Dorg.slf4j.simpleLogger.defaultLogLevel=warn

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: TestNG Results (${{ matrix.browser }})
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.browser }}
          path: target/surefire-reports/

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ matrix.browser }}
          path: ExtentReport/
          if-no-files-found: ignore

  # ========================
  # 3️⃣ PUBLISH JOB
  # ========================
  publish:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: staging

      - uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging