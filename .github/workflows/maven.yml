name: Java Maven CI with TestNG & JUnit Reporter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java & Maven Versions
        run: |
          java -version
          mvn -version

      - name: Build Project (Skip Tests)
        run: mvn -B clean install -DskipTests

      - name: Run TestNG Tests
        run: mvn -B test -q -Dbrowser=chrome-headless -Dorg.slf4j.simpleLogger.defaultLogLevel=warn

      # ✅ Publish structured test results inside GitHub UI
      - name: Publish Test Results (JUnit Format)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: TestNG Results
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit

      # ✅ Upload raw surefire reports as downloadable artifact
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: surefire-reports
          path: target/surefire-reports/


  publish-job:
    runs-on: ubuntu-latest
    needs: build_test
    if: always()   # <-- publish runs even if tests fail

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Artifact (Skip Tests)
        run: mvn -B clean package -DskipTests

      - name: Copy Artifact
        run: mkdir -p staging && cp target/*.jar staging || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging